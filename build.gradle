import net.neoforged.moddevgradle.legacyforge.internal.MinecraftMappings

plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
// Define wrapper values here so as to not have to always do so when updating gradlew.properties.
// Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
// documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
// file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
// (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// 版本号 = <MC版本>-forge-<构建当天的公历日期>，例如 1.20.1-forge-2026.9.22（月、日不补零）。
// 每次构建都会重新取当天日期，因此产物文件名天然带日期与 1.20.1-forge 片段。
def buildVersion = "${minecraft_version}-forge-${new Date().format('yyyy.M.d')}"

version = buildVersion
group = mod_group_id

repositories {
    mavenLocal()

    maven {
// Registrate's release repository.
        url = "https://maven.gegy.dev/releases"
    }

    maven {
// JEI
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
}

base {
    archivesName = mod_id
}

// 用 Java 21 的 JDK 编译，但必须产出 Java 17 字节码：
// 1.20.1 的玩家端跑的是 Java 17，且 Forge 自带的 Mixin 0.8.5 最高只认 JAVA_17（class version 61）。
// 若产出 Java 21 字节码（class version 65），真实环境会在 Mixin 阶段直接失败。
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

legacyForge {
// Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

// This line is optional. Access Transformers are automatically detected
// accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

// Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

// This run config launches GameTestServer and runs all registered gametests, then exits.
// By default, the server will crash when no gametests are provided.
// The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

// example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
// gameDirectory = project.file('run-data')

// Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

// applies to all the run configs above
        configureEach {
// Recommended logging data for a userdev environment
// The markers can be added/remove as needed separated by commas.
// "SCAN": For mods scan.
// "REGISTRIES": For firing of registry events.
// "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

// Recommended logging level for the console
// You can set various levels here.
// Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
// define mod <-> source bindings
// these are used to tell the game which sources are for which mod
// mostly optional in a single mod project
// but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// datagen 生成的资源可能与 src/main/resources 中手动维护的文件重名（如 blockstates/bighook.json），
// 需显式声明去重策略；src/main/resources 声明在前，手动文件优先。
tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// EMI 与 KubeJS 的 1.20.1 jar 暂不可用（需要联网获取），先排除其源码编译；
// 拿到 1.20.1 对应 jar 后在 build.gradle 声明 compileOnly 并移除排除即可。
sourceSets.main.java {
    exclude 'com/flavor_immersed_daily/integration/emi/**'
    exclude 'com/flavor_immersed_daily/integration/kubejs/**'
}

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

// jarJar 里嵌入的必须是「生产环境（SRG）」变体，而不是开发用的 named 变体：
// 1.20.1 真实游戏运行时是 SRG 名，嵌入 named 版的子模组会在加载时崩。
// 复合构建（includeBuild）下，jarJar 的依赖在配置期还是 ExternalModuleDependency，
// MDG 的 configureDependencyRemapping 只对 ProjectDependency 自动附加 srg 属性，
// 于是这里只会按消歧规则默认选到 named（devlibs 产物）。
// 显式让 jarJar 配置请求 SRG 变体，即可命中子模组的 reobfRuntimeElements（reobfJar 产物）。
configurations.named('jarJar') {
    attributes {
        attribute(MinecraftMappings.ATTRIBUTE, objects.named(MinecraftMappings, MinecraftMappings.SRG))
    }
}

dependencies {
// If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
// See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.

// Registrate - registry & datagen library, bundled into the mod jar via jarJar
// 必须使用 modImplementation（重映射配置）：ModDevGradle 会把它从 SRG 映射重映射为
// named 映射，否则 SRG 版 Registrate 在 named 运行时下会抛 NoSuchFieldError。
    modImplementation "com.tterrag.registrate:Registrate:${registrate_version}"
    jarJar "com.tterrag.registrate:Registrate:${registrate_version}"

// fidworkblock - 本模组的厨具附属，随本模组 jar 一起分发（Jar-in-Jar）。
// 它是同工作区的独立工程（settings.gradle 里的 includeBuild('fidworkblock')），
// 由 Gradle 复合构建直接提供产物，改完源码重新构建即生效，无需手动复制 jar。
// 注意：它仍是独立的 mod（modid 依旧是 fidworkblock），不会被并入本模组命名空间。
    jarJar "com.fidtest:fidworkblock:1.0.0"

// 仅 jarJar 只会把它打进 jar；开发运行时（runClient/runServer）的 classpath 上没有它。
// 1.20.1 的 Forge 运行时装的是 SRG 名，故必须走 modLocalRuntime 让 MDG 自动做
// SRG → named 重映射（该配置由下方 obfuscation.createRemappingConfiguration 建立）。
    modLocalRuntime "com.fidtest:fidworkblock:1.0.0"

// JEI - optional dependency for recipe viewing
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
// We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

// Jade - optional integration, compiled against the local 1.20.1 Forge jar (offline-friendly)
    compileOnly files("lib/Jade-1.20.1-forge.jar")

// FTB Ultimine —— 可选联动（不强依赖）：连锁收割。仅编译期引用其 API（api.rightclick），
// 运行时由 ModList.isLoaded("ftbultimine") 决定是否注册，缺失时相关类不会被加载。
// architectury 是 FTB API 的编译期传递依赖（RegisterRightClickHandlerEvent.REGISTER 的类型）。
    compileOnly files("lib/ftb-ultimine-forge-${ftb_ultimine_version}.jar")
    compileOnly files("lib/architectury-forge-${architectury_version}.jar")

// Thirst Was Taken —— 可选联动（不强依赖）：注册食物/饮品的口渴值。
// 仅编译期引用其 API，运行时由 ModList.isLoaded("thirst") 决定是否注册。
    compileOnly files("lib/ThirstWasTaken-${thirst_version}.jar")

// Example mod dependency using a mod jar from ./libs with a flat dir repository
// This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
// The group id is ignored when searching -- in this case, it is "blank"
// modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

// Example mod dependency using a file as dependency
// modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

// Example project dependency using a sister or child project:
// modImplementation project(":myproject")

// For more info:
// http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
// http://www.gradle.org/docs/current/userguide/dependency_management.html

// Mixin 注解处理器：1.20.1 生产环境运行时用的是 SRG 名，必须靠它把 @Shadow/@Inject 里的
// named 名（如 invulnerableTime）编译期映射成 SRG 名并生成 refMap，否则真实环境启动即崩。
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// 告诉 Mixin 注解处理器：主源码集里的 mixin 配置是哪个、refMap 叫什么名字。
// 缺这段就不会生成 refMap，只有 dev 环境正常、装进真实游戏就崩。
mixin {
    add sourceSets.main, 'flavor_immersed_daily.refmap.json'
    config 'flavor_immersed_daily.mixins.json'
}

jar {
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json"
    ])
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : buildVersion,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
// Use the UTF-8 charset for Java compilation
    options.encoding = 'UTF-8'
// 显示全部编译错误，便于移植排查
    options.compilerArgs << '-Xmaxerrs' << '3000'
// 强制产出 Java 17 字节码，真实游戏（Java 17 + Mixin 0.8.5）才能加载
    options.release = 17
// 禁用所有警告
    options.compilerArgs << '-Xlint:none'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 一次 `gradlew build` 同时构建两个工程：本模组 + 同工作区的 fidworkblock，
// 保证嵌进去的始终是子模组的最新产物（构建同步）。
tasks.named('build') {
    dependsOn gradle.includedBuild('fidworkblock').task(':build')
}

