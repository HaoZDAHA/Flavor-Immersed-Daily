# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 必须关闭配置缓存：版本号按“构建当天日期”生成（见 build.gradle），
# 而配置缓存会把配置阶段的结果（含当天日期）缓存起来复用，导致跨天构建仍沿用旧日期。
# 关闭后配置阶段每次重新执行，日期才能随当天变化。构建缓存（org.gradle.caching）不受影响。
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Environment Properties
# You can find the latest versions here: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1, 1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.12
# The Forge version range can use any version of Forge as bounds
forge_version_range=[47.1.3,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[47,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=flavor_immersed_daily
# The human-readable display name for the mod.
mod_name=Flavor Immersed Daily
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# 已废弃：版本号现由 build.gradle 按构建当天日期自动生成（形如 1.20.1-forge-2026.9.22），
# 此项不再参与构建，仅作历史保留。
mod_version=2026.9.17beta
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.flavor_immersed_daily
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Flavor Immersed Daily Team
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A Minecraft mod that brings the warmth of daily life and culinary delights into your world.

## Dependency Versions

# Registrate - registry and data-generation helper library
registrate_version=MC1.20-1.3.11
# JEI - optional dependency for recipe viewing
jei_version=15.20.0.112
# FTB Ultimine - optional integration for chain-harvest support (不强依赖)
ftb_ultimine_version=2001.1.8
# Architectury API - FTB Ultimine 的编译期传递依赖（仅为编译其 API 需要）
architectury_version=9.2.14
# Thirst Was Taken - optional integration for thirst/hydration values (不强依赖)
thirst_version=1.20.1-1.3.8
